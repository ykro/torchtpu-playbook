<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 284" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtensor-mesh-2x2-title dtensor-mesh-2x2-desc" id="d-03-dtensor-mesh-2x2-root">
        <title id="dtensor-mesh-2x2-title">Sharding declarado con DeviceMesh y DTensor</title>
        <desc id="dtensor-mesh-2x2-desc">Cuatro ranks en un mesh de 2 por 2. El batch se parte en data y las dos capas del MLP en model, por columnas y por filas. DTensor inserta un solo all_reduce en el forward.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-03-dtensor-mesh-2x2-root { --color-paper: #F7F6F2; --color-paper-2: #EFECE6; --color-ink: #0F2547;
      --color-muted: #3B5B8C; --color-accent: #C59216; --color-accent-text: #9A6F0B;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #d-03-dtensor-mesh-2x2-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-03-dtensor-mesh-2x2-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-03-dtensor-mesh-2x2-root .diagram-container { overflow-x: visible; }</style>

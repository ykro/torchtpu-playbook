          <marker id="d-03-dtensor-mesh-2x2-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#C59216"/></marker>
        </defs>
        <rect width="728" height="284" fill="#F7F6F2"/>

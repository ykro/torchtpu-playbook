<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pytorch-jax-bridge-title pytorch-jax-bridge-desc" id="d-03-pytorch-jax-bridge-root">
        <title id="pytorch-jax-bridge-title">Calling Compiled @jax.jit + jax.vjp Kernels Inside PyTorch Autograd</title>
        <desc id="pytorch-jax-bridge-desc">Role-scoped data flow across PyTorch Autograd, DLPack Zero-Copy Bridge, and OpenXLA JAX Runtime showing forward and backward pass tensor handoffs without buffer copies.</desc>

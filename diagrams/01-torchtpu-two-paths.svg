<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="torchtpu-two-paths-title torchtpu-two-paths-desc" id="d-01-torchtpu-two-paths-root">
        <title id="torchtpu-two-paths-title">Dos caminos de PyTorch hacia la TPU con TorchTPU</title>
        <desc id="torchtpu-two-paths-desc">Eager: cada op se despacha al dispositivo tpu registrado como PrivateUse1. Compilado: TorchDynamo captura un grafo FX que el backend tpu baja a StableHLO y XLA compila a un ejecutable que se cachea.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-01-torchtpu-two-paths-root { --color-paper: #F7F6F2; --color-paper-2: #EFECE6; --color-ink: #0F2547;
      --color-muted: #3B5B8C; --color-accent: #C59216; --color-accent-text: #9A6F0B;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #d-01-torchtpu-two-paths-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-01-torchtpu-two-paths-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-01-torchtpu-two-paths-root .diagram-container { overflow-x: visible; }</style>

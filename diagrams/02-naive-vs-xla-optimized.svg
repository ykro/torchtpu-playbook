<?xml version="1.0" encoding="UTF-8"?>
<svg data-diagram="architecture-delta" viewBox="0 0 1080 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="naive-vs-xla-optimized-title naive-vs-xla-optimized-desc" id="d-02-naive-vs-xla-optimized-root">
        <title id="naive-vs-xla-optimized-title">Naive PyTorch on TPU vs OpenXLA-Optimized Training Topology</title>
        <desc id="naive-vs-xla-optimized-desc">Architecture delta comparing a naive PyTorch loop with dynamic shapes, aten::nonzero CPU fallback, and mid-step loss.item() stalls against an OpenXLA-optimized topology with static bucket shapes, torch.where, and async step closures.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-02-naive-vs-xla-optimized-root { --color-paper:   #F7F6F2;
      --color-paper-2: #EFECE6;
      --color-ink:     #0F2547;
      --color-muted:   #3B5B8C;
      --color-accent:  #C59216;
      --color-accent-text: #9A6F0B;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-02-naive-vs-xla-optimized-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-02-naive-vs-xla-optimized-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-02-naive-vs-xla-optimized-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-02-naive-vs-xla-optimized-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/>
          </marker>
          <marker id="d-02-naive-vs-xla-optimized-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#C59216"/>
          </marker>
          <pattern id="d-02-naive-vs-xla-optimized-dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="0.85" fill="#0f2547" fill-opacity="0.10"/>
          </pattern>
        </defs>

        <rect width="1080" height="580" fill="#F7F6F2"/>
        <rect width="1080" height="580" fill="url(#d-02-naive-vs-xla-optimized-dots)" opacity="0.6"/>

        <!-- Panel Chrome & Headers -->
        <rect x="24" y="20" width="336" height="488" rx="6" fill="#0f2547" fill-opacity="0.02" stroke="#0f2547" stroke-opacity="0.18" stroke-width="1"/>
        <text x="40" y="42" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">BEFORE · NAIVE PYTORCH (12 COMPILES)</text>

        <rect x="380" y="20" width="320" height="488" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.18" stroke-width="1"/>
        <text x="396" y="42" fill="#0F2547" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">CHANGES LEDGER · 3 XLA FIXES</text>

        <rect x="720" y="20" width="336" height="488" rx="6" fill="#c59216" fill-opacity="0.04" stroke="#c59216" stroke-opacity="0.35" stroke-width="1"/>
        <text x="736" y="42" fill="#9A6F0B" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">AFTER · OPENXLA-OPTIMIZED (1 COMPILE)</text>

        <!-- ==================== BEFORE SNAPSHOT ==================== -->
        <g data-snapshot="before" data-grid="336 440 4" transform="translate(24 56)">
          <!-- Relationships (drawn before components) -->
          <path data-kind="relationship" data-object-id="edge-batch-op" data-status="unchanged" data-signature="flow=batch-to-mask" data-from="batch-loader" data-to="mask-op" d="M 168 76 L 168 116" fill="none" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#d-02-naive-vs-xla-optimized-arrow)"/>
          <path data-kind="relationship" data-object-id="edge-op-fallback" data-status="removed" data-signature="flow=nonzero-cpu-fallback" data-from="mask-op" data-to="cpu-fallback" d="M 168 180 L 168 220" fill="none" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#d-02-naive-vs-xla-optimized-arrow)"/>
          <path data-kind="relationship" data-object-id="edge-fallback-tpu" data-status="removed" data-signature="flow=fallback-to-tpu" data-from="cpu-fallback" data-to="tpu-step" d="M 168 284 L 168 324" fill="none" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#d-02-naive-vs-xla-optimized-arrow)"/>
          <path data-kind="relationship" data-object-id="edge-tpu-log" data-status="changed" data-signature="sync=blocking-item" data-from="tpu-step" data-to="step-logger" d="M 232 356 L 260 356" fill="none" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#d-02-naive-vs-xla-optimized-arrow)"/>

          <!-- Component 1: batch-loader (changed) -->
          <g data-kind="component" data-object-id="batch-loader" data-status="changed" data-signature="batch:shapes=variable-unpadded">
            <rect data-role="bounds" x="48" y="12" width="240" height="64" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1.2"/>
            <text x="60" y="30" fill="#3B5B8C" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Δ batch-loader</text>
            <text x="60" y="48" fill="#0F2547" font-size="12.5" font-family="'Geist', sans-serif" font-weight="600">Variable Sequence Batch</text>
            <text x="60" y="64" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">seq_len=[20..60] · UncachedCompile</text>
          </g>

          <!-- Component 2: mask-op (changed) -->
          <g data-kind="component" data-object-id="mask-op" data-status="changed" data-signature="mask:op=boolean-index-h[h>0]">
            <rect data-role="bounds" x="48" y="116" width="240" height="64" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1.2"/>
            <text x="60" y="134" fill="#3B5B8C" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Δ mask-op</text>
            <text x="60" y="152" fill="#0F2547" font-size="12.5" font-family="'Geist', sans-serif" font-weight="600">Boolean Mask h[h &gt; 0]</text>
            <text x="60" y="168" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">Data-dependent output shape</text>
          </g>

          <!-- Component 3: cpu-fallback (removed) -->
          <g data-kind="component" data-object-id="cpu-fallback" data-status="removed" data-signature="fallback:op=aten::nonzero">
            <rect data-role="bounds" x="48" y="220" width="240" height="64" rx="6" fill="#F7F6F2" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="5,3"/>
            <text x="60" y="238" fill="#3B5B8C" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">− cpu-fallback</text>
            <text x="60" y="256" fill="#0F2547" font-size="12.5" font-family="'Geist', sans-serif" font-weight="600">Eager CPU Fallback</text>
            <text x="60" y="272" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">aten::nonzero (12 fallbacks)</text>
          </g>

          <!-- Component 4: tpu-step (changed) -->
          <g data-kind="component" data-object-id="tpu-step" data-status="changed" data-signature="tpu-step:compiles=12;stalls=12">
            <rect data-role="bounds" x="20" y="324" width="212" height="64" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1.2"/>
            <text x="32" y="342" fill="#3B5B8C" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Δ tpu-step</text>
            <text x="32" y="360" fill="#0F2547" font-size="12.5" font-family="'Geist', sans-serif" font-weight="600">Fragmented TPU Step</text>
            <text x="32" y="376" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">12 Compiles · 12 Stalls</text>
          </g>

          <!-- Component 5: step-logger (changed) -->
          <g data-kind="component" data-object-id="step-logger" data-status="changed" data-signature="logger:mode=sync-loss-item">
            <rect data-role="bounds" x="260" y="324" width="64" height="64" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1.2"/>
            <text x="292" y="344" fill="#3B5B8C" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Δ log</text>
            <text x="292" y="360" fill="#0F2547" font-size="10" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">.item()</text>
            <text x="292" y="376" fill="#3B5B8C" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Stall</text>
          </g>
        </g>

        <!-- ==================== AFTER SNAPSHOT ==================== -->
        <g data-snapshot="after" data-grid="336 440 4" transform="translate(720 56)">
          <!-- Relationships (drawn before components) -->
          <path data-kind="relationship" data-object-id="edge-batch-op" data-status="unchanged" data-signature="flow=batch-to-mask" data-from="batch-loader" data-to="mask-op" d="M 168 76 L 168 116" fill="none" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#d-02-naive-vs-xla-optimized-arrow)"/>
          <path data-kind="relationship" data-object-id="edge-op-tpu" data-status="added" data-signature="flow=static-hlo-fusion" data-from="mask-op" data-to="tpu-step" d="M 168 180 L 168 324" fill="none" stroke="#C59216" stroke-width="1.5" marker-end="url(#d-02-naive-vs-xla-optimized-arrow-accent)"/>
          <path data-kind="relationship" data-object-id="edge-tpu-log" data-status="changed" data-signature="sync=async-step-closure" data-from="tpu-step" data-to="step-logger" d="M 232 356 L 260 356" fill="none" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#d-02-naive-vs-xla-optimized-arrow)"/>

          <!-- Component 1: batch-loader (changed) -->
          <g data-kind="component" data-object-id="batch-loader" data-status="changed" data-signature="batch:shapes=static-bucket-64">
            <rect data-role="bounds" x="48" y="12" width="240" height="64" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1.2"/>
            <text x="60" y="30" fill="#3B5B8C" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Δ batch-loader</text>
            <text x="60" y="48" fill="#0F2547" font-size="12.5" font-family="'Geist', sans-serif" font-weight="600">Static Bucket Padding</text>
            <text x="60" y="64" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">bucket_len=64 + attention mask</text>
          </g>

          <!-- Component 2: mask-op (changed, Focal Accent) -->
          <g data-kind="component" data-object-id="mask-op" data-status="changed" data-signature="mask:op=static-torch-where">
            <rect data-role="bounds" x="48" y="116" width="240" height="64" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.6"/>
            <text x="60" y="134" fill="#9A6F0B" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Δ mask-op</text>
            <text x="60" y="152" fill="#0F2547" font-size="12.5" font-family="'Geist', sans-serif" font-weight="600">Static torch.where(h &gt; 0)</text>
            <text x="60" y="168" fill="#9A6F0B" font-size="9" font-family="'Geist Mono', monospace">0 aten::nonzero fallbacks</text>
          </g>

          <!-- Component 4: tpu-step (changed, Focal Accent) -->
          <g data-kind="component" data-object-id="tpu-step" data-status="changed" data-signature="tpu-step:compiles=1;stalls=0">
            <rect data-role="bounds" x="20" y="324" width="212" height="64" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.6"/>
            <text x="32" y="342" fill="#9A6F0B" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Δ tpu-step</text>
            <text x="32" y="360" fill="#0F2547" font-size="12.5" font-family="'Geist', sans-serif" font-weight="600">Fused OpenXLA Step</text>
            <text x="32" y="376" fill="#9A6F0B" font-size="9" font-family="'Geist Mono', monospace">1 Compile · 5 Cached · 0 Stalls</text>
          </g>

          <!-- Component 5: step-logger (changed) -->
          <g data-kind="component" data-object-id="step-logger" data-status="changed" data-signature="logger:mode=async-closure">
            <rect data-role="bounds" x="260" y="324" width="64" height="64" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1.2"/>
            <text x="292" y="344" fill="#3B5B8C" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Δ log</text>
            <text x="292" y="360" fill="#0F2547" font-size="10" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Closure</text>
            <text x="292" y="376" fill="#3B5B8C" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Async</text>
          </g>
        </g>

        <!-- ==================== CENTER CHANGES LEDGER ==================== -->
        <text data-change="CHANGED" data-target="batch-loader" x="396" y="72" fill="#0F2547" font-size="9.5" font-family="'Geist Mono', monospace">
          <tspan font-weight="600">CHANGED batch-loader</tspan>
          <tspan x="396" dy="14" fill="#3B5B8C">Unpadded [20..60] → static bucket 64</tspan>
        </text>

        <text data-change="CHANGED" data-target="mask-op" x="396" y="120" fill="#0F2547" font-size="9.5" font-family="'Geist Mono', monospace">
          <tspan font-weight="600" fill="#9A6F0B">CHANGED mask-op</tspan>
          <tspan x="396" dy="14" fill="#3B5B8C">Dynamic h[h&gt;0] → static torch.where</tspan>
        </text>

        <text data-change="REMOVED" data-target="cpu-fallback" x="396" y="168" fill="#0F2547" font-size="9.5" font-family="'Geist Mono', monospace">
          <tspan font-weight="600">REMOVED cpu-fallback</tspan>
          <tspan x="396" dy="14" fill="#3B5B8C">Eliminated aten::nonzero CPU roundtrip</tspan>
        </text>

        <text data-change="REMOVED" data-target="edge-op-fallback" x="396" y="216" fill="#0F2547" font-size="9.5" font-family="'Geist Mono', monospace">
          <tspan font-weight="600">REMOVED edge-op-fallback</tspan>
          <tspan x="396" dy="14" fill="#3B5B8C">Cut mask-op → CPU fallback hop</tspan>
        </text>

        <text data-change="REMOVED" data-target="edge-fallback-tpu" x="396" y="264" fill="#0F2547" font-size="9.5" font-family="'Geist Mono', monospace">
          <tspan font-weight="600">REMOVED edge-fallback-tpu</tspan>
          <tspan x="396" dy="14" fill="#3B5B8C">Cut CPU fallback → TPU re-upload</tspan>
        </text>

        <text data-change="ADDED" data-target="edge-op-tpu" x="396" y="312" fill="#0F2547" font-size="9.5" font-family="'Geist Mono', monospace">
          <tspan font-weight="600" fill="#9A6F0B">ADDED edge-op-tpu</tspan>
          <tspan x="396" dy="14" fill="#3B5B8C">Direct fused HLO path on TPU MXU</tspan>
        </text>

        <text data-change="CHANGED" data-target="tpu-step" x="396" y="360" fill="#0F2547" font-size="9.5" font-family="'Geist Mono', monospace">
          <tspan font-weight="600" fill="#9A6F0B">CHANGED tpu-step</tspan>
          <tspan x="396" dy="14" fill="#3B5B8C">12 compiles → 1 warmup + 5 cached</tspan>
        </text>

        <text data-change="CHANGED" data-target="step-logger" x="396" y="408" fill="#0F2547" font-size="9.5" font-family="'Geist Mono', monospace">
          <tspan font-weight="600">CHANGED step-logger</tspan>
          <tspan x="396" dy="14" fill="#3B5B8C">Blocking .item() → add_step_closure</tspan>
        </text>

        <text data-change="CHANGED" data-target="edge-tpu-log" x="396" y="456" fill="#0F2547" font-size="9.5" font-family="'Geist Mono', monospace">
          <tspan font-weight="600">CHANGED edge-tpu-log</tspan>
          <tspan x="396" dy="14" fill="#3B5B8C">Mid-step stall → post-barrier callback</tspan>
        </text>

        <!-- Bottom Legend Strip -->
        <line x1="24" y1="528" x2="1056" y2="528" stroke="#0f2547" stroke-opacity="0.16" stroke-width="1"/>
        <rect x="32" y="544" width="16" height="12" rx="2" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.4"/>
        <text x="56" y="554" fill="#0F2547" font-size="10" font-family="'Geist Mono', monospace">Δ CHANGED (OpenXLA-optimized focal node)</text>

        <rect x="360" y="544" width="16" height="12" rx="2" fill="#F7F6F2" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="3,2"/>
        <text x="384" y="554" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace">− REMOVED (Eager CPU fallback path)</text>

        <line x1="660" y1="550" x2="696" y2="550" stroke="#C59216" stroke-width="1.5" marker-end="url(#d-02-naive-vs-xla-optimized-arrow-accent)"/>
        <text x="708" y="554" fill="#0F2547" font-size="10" font-family="'Geist Mono', monospace">+ ADDED (Fused HLO execution edge)</text>
      </svg>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puente PyTorch y JAX con DLPack sobre StableHLO</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #F7F6F2; --color-paper-2: #EFECE6; --color-ink: #0F2547;
      --color-muted: #3B5B8C; --color-accent: #C59216; --color-accent-text: #9A6F0B;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .frame { max-width: 1080px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.4rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.2vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.25rem; }
    svg { width: 100%; min-width: 728px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Interop · DLPack y StableHLO</p>
    <h1>Puente PyTorch y JAX con DLPack sobre StableHLO</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 728 332" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pytorch-jax-bridge-title pytorch-jax-bridge-desc">
        <title id="pytorch-jax-bridge-title">Puente PyTorch y JAX con DLPack sobre StableHLO</title>
        <desc id="pytorch-jax-bridge-desc">Un nn.Module de PyTorch llama un kernel @jax.jit con su VJP. Los tensores cruzan por DLPack sin copia y el kernel se baja a un módulo StableHLO que XLA compila.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="rgba(15,37,71,0.10)"/>
          </pattern>
          <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3B5B8C"/></marker>
          <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#C59216"/></marker>
        </defs>
        <rect width="728" height="332" fill="#F7F6F2"/>
        <rect width="728" height="332" fill="url(#dots)"/>
        <line x1="0" y1="36" x2="728" y2="36" stroke="rgba(15,37,71,0.14)" stroke-width="0.8"/>
        <line x1="0" y1="126" x2="728" y2="126" stroke="rgba(15,37,71,0.14)" stroke-width="0.8"/>
        <line x1="0" y1="216" x2="728" y2="216" stroke="rgba(15,37,71,0.14)" stroke-width="0.8"/>
        <rect x="0" y="126" width="728" height="90" fill="rgba(15,37,71,0.018)"/>
        <text x="364" y="24" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">PYTORCH Y JAX COMPARTEN MEMORIA; STABLEHLO ES EL IDIOMA COMÚN</text>
        <text x="64" y="78" fill="#3B5B8C" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">PYTORCH</text>
        <text x="64" y="168" fill="#3B5B8C" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">DLPACK</text>
        <text x="64" y="258" fill="#3B5B8C" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">JAX /</text>
        <text x="64" y="270" fill="#3B5B8C" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">OPENXLA</text>
        <rect x="142" y="48" width="120" height="66" rx="6" fill="#F7F6F2" stroke="rgba(15,37,71,0.28)" stroke-width="1"/>
        <rect x="146" y="52" width="33" height="10" rx="3" fill="rgba(15,37,71,0.12)"/>
        <text x="162.5" y="59" fill="#0F2547" font-size="6" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TORCH</text>
        <text x="202.0" y="74" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">autograd.Function</text>
        <text x="202.0" y="86" fill="#3B5B8C" font-size="6.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">forward y backward</text>
        <text x="202.0" y="97" fill="#3B5B8C" font-size="6.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">dentro de nn.Module</text>
        <rect x="302" y="138" width="120" height="66" rx="6" fill="#F7F6F2" stroke="rgba(15,37,71,0.28)" stroke-width="1"/>
        <rect x="306" y="142" width="38" height="10" rx="3" fill="rgba(15,37,71,0.12)"/>
        <text x="325.0" y="149" fill="#0F2547" font-size="6" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">DLPACK</text>
        <text x="362.0" y="164" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">from_dlpack</text>
        <text x="362.0" y="176" fill="#3B5B8C" font-size="6.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">mismo buffer</text>
        <text x="362.0" y="187" fill="#3B5B8C" font-size="6.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">sin copia (CPU)</text>
        <rect x="462" y="228" width="120" height="66" rx="6" fill="rgba(197,146,22,0.12)" stroke="#C59216" stroke-width="1.5"/>
        <rect x="466" y="232" width="23" height="10" rx="3" fill="rgba(197,146,22,0.24)"/>
        <text x="477.5" y="239" fill="#9A6F0B" font-size="6" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">JAX</text>
        <text x="522.0" y="254" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">@jax.jit + jax.vjp</text>
        <text x="522.0" y="266" fill="#9A6F0B" font-size="6.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">RMSNorm + SwiGLU</text>
        <text x="522.0" y="277" fill="#3B5B8C" font-size="6.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">28 ops StableHLO</text>
        <rect x="602" y="48" width="112" height="66" rx="6" fill="#F7F6F2" stroke="rgba(15,37,71,0.28)" stroke-width="1"/>
        <rect x="606" y="52" width="33" height="10" rx="3" fill="rgba(15,37,71,0.12)"/>
        <text x="622.5" y="59" fill="#0F2547" font-size="6" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TORCH</text>
        <text x="658.0" y="74" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">AdamW</text>
        <text x="658.0" y="86" fill="#3B5B8C" font-size="6.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">grads de JAX</text>
        <text x="658.0" y="97" fill="#3B5B8C" font-size="6.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">loss 1.00 -&gt; 0.89</text>
        <path d="M 262 81 L 362 81 L 362 134" fill="none" stroke="#3B5B8C" stroke-width="1.0" marker-end="url(#arr-muted)"/>
        <path d="M 422 171 L 522 171 L 522 224" fill="none" stroke="#C59216" stroke-width="1.3" marker-end="url(#arr-accent)"/>
        <rect x="455.4" y="157" width="33.2" height="11" fill="#F7F6F2"/>
        <text x="472" y="165" fill="#9A6F0B" font-size="6.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">0-copy</text>
        <path d="M 582 261 L 658 261 L 658 118" fill="none" stroke="#3B5B8C" stroke-width="1.0" marker-end="url(#arr-muted)"/>
        <text x="364" y="318" fill="#0F2547" font-size="7" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">Paridad con PyTorch puro: forward 2.4e-07, gradientes 2.9e-11 · zero-copy verificado solo en CPU</text>
      </svg>
    </div>
  </div>
</body>
</html>

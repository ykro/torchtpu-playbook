[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torchtpu-playbook"
version = "0.2.0"
description = "PyTorch on Cloud TPU with TorchTPU: eager vs torch.compile, graph breaks, static shapes, DTensor sharding and the PyTorch <-> JAX bridge over StableHLO, verified on CPU."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Adrián Catalán" }
]
dependencies = [
  "torch>=2.9.0",
  "jax>=0.7.0",
  "jaxlib>=0.7.0",
  "numpy>=1.26.0",
]

# On a Cloud TPU VM (Linux x86_64 only) add TorchTPU:
#   pip install torch_tpu==0.2.0 --extra-index-url https://download.pytorch.org/whl/cpu

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

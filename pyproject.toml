[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-xla-tpu-playbook"
version = "0.1.0"
description = "Practical playbook for migrating PyTorch workloads to OpenXLA and Cloud TPU without graph breaks, host sync stalls, or dynamic-shape recompilations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Adrián Catalán" }
]
dependencies = [
  "torch>=2.4.0",
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
